apiVersion: apps/v1
kind: Deployment
metadata:
  name: vista-api
  labels:
    app: vista-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: vista-api
  template:
    metadata:
      labels:
        app: vista-api
    spec:
      containers:
        - name: api
          image: vista-api:latest
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: vista-secrets
                  key: database-url
            - name: REDIS_URL
              value: "redis://vista-redis:6379"
            - name: KAFKA_BROKERS
              value: "vista-kafka:9092"
            - name: CLICKHOUSE_URL
              value: "http://vista-clickhouse:8123"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: vista-api-service
spec:
  type: ClusterIP
  selector:
    app: vista-api
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vista-web
  labels:
    app: vista-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vista-web
  template:
    metadata:
      labels:
        app: vista-web
    spec:
      containers:
        - name: web
          image: vista-web:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: vista-web-service
spec:
  type: LoadBalancer
  selector:
    app: vista-web
  ports:
    - port: 80
      targetPort: 80
