services:
  # 1. PostgreSQL (3NF Relational Core)
  postgres:
    image: postgres:16-alpine
    container_name: vista-postgres
    environment:
      POSTGRES_USER: vista
      POSTGRES_PASSWORD: vista_secret
      POSTGRES_DB: vista
    ports:
      - "5432:5432"
    volumes:
      - ./backend/api/src/shared/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vista -d vista"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis (Hot Deduplication & Trust Cache)
  redis:
    image: redis:7-alpine
    container_name: vista-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. ClickHouse (Columnar Time-Series Analytics)
  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: vista-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ./backend/api/src/shared/db/clickhouse_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - chdata:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 4. Kafka & Zookeeper (Messaging Backbone)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: vista-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: vista-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  # 5. VISTA API Control Plane
  api:
    build:
      context: .
      dockerfile: backend/api/Dockerfile
    container_name: vista-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://vista:vista_secret@postgres:5432/vista
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
      CLICKHOUSE_URL: http://clickhouse:8123
      UI_ORIGIN: http://localhost:5173

  # 6. VISTA Frontend Dashboard
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: vista-frontend
    depends_on:
      - api
    ports:
      - "5173:80"

  # 7. VISTA Batch Attribution Worker
  batch-attribution:
    build:
      context: .
      dockerfile: backend/batch-attribution/Dockerfile
    container_name: vista-batch-attribution
    depends_on:
      - api

  # 8. VISTA Decoupled Streaming Veracity Worker (Kafka Ingestion Engine)
  streaming:
    build:
      context: .
      dockerfile: backend/streaming/Dockerfile
    container_name: vista-streaming
    depends_on:
      - kafka
      - redis
      - clickhouse
    environment:
      NODE_ENV: production
      KAFKA_BROKERS: kafka:29092
      REDIS_URL: redis://redis:6379
      CLICKHOUSE_URL: http://clickhouse:8123
      DATABASE_URL: postgres://vista:vista_secret@postgres:5432/vista

  # 9. VISTA Chaos Telemetry Simulator
  simulator:
    build:
      context: .
      dockerfile: backend/simulator/Dockerfile
    container_name: vista-simulator
    depends_on:
      - kafka
      - api

  # 10. Apache Flink Streaming Engine (JobManager)
  flink-jobmanager:
    image: flink:1.18-scala_2.12-java17
    container_name: vista-flink-jobmanager
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        parallelism.default: 2

  # 11. Apache Flink Streaming Engine (TaskManager)
  flink-taskmanager:
    image: flink:1.18-scala_2.12-java17
    container_name: vista-flink-taskmanager
    depends_on:
      - flink-jobmanager
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        parallelism.default: 2

volumes:
  pgdata:
  redisdata:
  chdata:
